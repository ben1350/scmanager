{@com.rosswood.entity.SalesInvoice invoice}

<div class="grey lighten-4" style="padding: 15px; border-left: 4px solid #ff9800; margin: 5px 10px;">
    <h6 style="margin-top:0">Items for Invoice: <strong>{invoice.invoiceNo}</strong></h6>
    <table class="white bordered striped">
        <thead>
        <tr class="grey-text">
            <th>Item</th>
            <th class="right-align">Qty</th>
            <th class="right-align">Unit Price</th>
            <th class="right-align">Line Total</th>
        </tr>
        </thead>
        <tbody>
        {#for item in invoice.items}
            <tr>
                <td>{item.item.itemName}</td>
                <td class="right-align">{item.quantity}</td>
                <td class="right-align">{item.unitPrice}</td>
                <td class="right-align">{item.lineTotal}</td>
            </tr>
        {/for}
        <tr class="blue-grey lighten-5">
            <td colspan="4">
                <form hx-post="{uri:SalesInvoiceController.addInvoiceItem(invoice.id)}" hx-target="closest div">
                        {#authenticityToken/}
                    <div class="row" style="margin-bottom: 0; display: flex; align-items: center;">
                        <div class="col s4">
                            <select name="itemId" required>
                                <option value="" disabled selected>Choose Item</option>
                                {#for item in availableItems}
                                    <option value="{item.id}">{item.itemCode} - {item.itemName}</option>
                                {/for}
                            </select>
                        </div>
                        <div class="col s2">
                            <input name="quantity" type="number" step="0.01" placeholder="Qty" required style="height: 2rem;">
                        </div>
                        <div class="col s3">
                            <input name="unitPrice" type="number" step="0.01" placeholder="Price" required style="height: 2rem;">
                        </div>
                        <div class="col s3">
                            <button class="btn-small orange waves-effect">
                                <i class="material-icons">add_shopping_cart</i>
                            </button>
                        </div>
                    </div>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script>
    // Initial load
    document.addEventListener('DOMContentLoaded', function() {
        M.FormSelect.init(document.querySelectorAll('select'));
    });

    // Handle HTMX updates
    document.body.addEventListener('htmx:afterProcessNode', function(evt) {
        const newSelects = evt.detail.elt.querySelectorAll('select');
        if (newSelects.length > 0) {
            M.FormSelect.init(newSelects);
        }
    });
</script>
