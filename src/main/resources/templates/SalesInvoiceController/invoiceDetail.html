{@com.rosswood.entity.SalesInvoice invoice}
<div class="invoice-detail-pane" style="padding: 1.5rem 2.5rem 2.5rem 2.5rem; border-top: 1px solid rgba(0,0,0,0.05);">
    <h6 style="color: #9e9e9e; font-size: 0.7rem; letter-spacing: 1.5px; font-weight: 800; text-transform: uppercase; margin-bottom: 1.2rem;">Line Items</h6>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem;">
        {#for item in invoice.items}
            <div style="background: white; border-radius: 12px; padding: 1rem; display: flex; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.03);">
                <div style="background: #e8f5e9; color: #2e7d32; padding: 8px; border-radius: 8px; margin-right: 12px;">
                    <i class="material-icons" style="font-size: 1.2rem;">shopping_bag</i>
                </div>
                <div style="flex-grow: 1;">
                    <div style="font-weight: 700; color: #333; font-size: 0.9rem;">{item.item.itemName}</div>
                    <div style="color: #757575; font-size: 0.8rem;">{item.quantity} x GHS {item.unitPrice}</div>
                </div>
                <div style="font-weight: 800; color: #1e88e5;">GHS {item.lineTotal}</div>
            </div>
        {/for}
    </div>

    <div style="margin-top: 2rem; background: #fafafa; padding: 1.2rem; border-radius: 12px; border: 1px dashed #e0e0e0;">
        <form hx-post="{uri:SalesInvoiceController.addInvoiceItem(invoice.id)}" hx-target="#detail-{invoice.id}">
                {#authenticityToken/}
            <div style="display: flex; gap: 12px; align-items: center; background: white; padding: 8px; border-radius: 50px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                <select name="itemId"  style="border: none; flex: 2; height: 35px; padding-left: 15px; font-weight: 600;">
                    <option value="" disabled selected>Select Product</option>
                    {#for ai in availableItems}
                        <option value="{ai.id}">{ai.itemName}</option>
                    {/for}
                </select>
                <div style="width: 1px; height: 20px; background: #eee;"></div>
                <input name="quantity" type="number" step="0.01" placeholder="Qty" required style="border: none !important; box-shadow: none !important; flex: 1; margin: 0; height: 35px;">
                <div style="width: 1px; height: 20px; background: #eee;"></div>
                <input name="unitPrice" type="number" step="0.01" placeholder="Price" required style="border: none !important; box-shadow: none !important; flex: 1; margin: 0; height: 35px;">
                <button type="submit" class="btn blue darken-2" style="border-radius: 50px; text-transform: none; font-weight: 600; padding: 0 25px;">Add Item</button>
            </div>
        </form>
    </div>
</div>

<div style="display: none;">
    <div id="total-{invoice.id}" hx-swap-oob="true" style="font-weight: 800; color: #1e88e5; font-size: 1.1rem;">
        GHS {invoice.totalAmount}
    </div>
</div>
