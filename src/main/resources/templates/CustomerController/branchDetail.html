{@com.rosswood.entity.Customer customer}

<div class="branch-detail-pane" style="padding: 2rem; animation: fadeIn 0.4s ease-out;">
  <div class="row">
    <div class="col s12">
      <h6 class="grey-text uppercase" style="font-size: 0.75rem; letter-spacing: 1px; font-weight: 700; margin-bottom: 1.5rem;">
        BRANCH LOCATIONS ({customer.branches.size()})
      </h6>

      <ul class="collection no-border" style="border: none; background: transparent;">
        {#for b in customer.branches}
          <li class="collection-item avatar" style="background: transparent; border-bottom: 1px solid #e0e0e0;">
            <i class="material-icons circle green lighten-4 green-text">location_city</i>
            <div class="row" style="margin-bottom: 0;">
              <div class="col s12">
                <span class="title" style="font-weight: 600;">{b.branchName}</span>
                <p class="grey-text" style="font-size: 0.85rem;">{b.branchAddress ?: 'No address provided'}</p>
              </div>
            </div>
          </li>
        {/for}
      </ul>
    </div>
  </div>

  <div class="add-branch-bar white z-depth-1" style="border-radius: 50px; padding: 0.5rem 1.5rem; margin-top: 1rem; border: 1px solid #eee;">
    <form hx-post="{uri:CustomerController.addBranch(customer.id)}"
          hx-target="#detail-{customer.id}"
          hx-swap="innerHTML">
        {#authenticityToken/}
      <div class="row" style="margin-bottom: 0; display: flex; align-items: center;">
        <div class="col s5">
          <input name="branchName" placeholder="New Branch Name" required
                 style="border: none; border-bottom: 1px solid #eee; height: 2.5rem; margin-bottom: 0;">
        </div>
        <div class="col s5">
          <input name="branchAddress" placeholder="Branch Address"
                 style="border: none; border-bottom: 1px solid #eee; height: 2.5rem; margin-bottom: 0;">
        </div>
        <div class="col s2 right-align">
          <button class="btn-floating waves-effect waves-light blue darken-2">
            <i class="material-icons">add</i>
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
