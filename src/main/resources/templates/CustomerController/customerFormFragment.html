<div id="new-customer-row" class="card inline-form-card" style="border-radius: 12px; margin-bottom: 2rem; border: 2px dashed #2196f3 !important; background: #fafafa;">
    <form hx-post="{uri:CustomerController.add()}"
          hx-target="#customerListContainer"
          hx-swap="innerHTML">
            {#authenticityToken/}
        <div class="card-content">
            <span class="card-title blue-text text-darken-2" style="font-size: 1.2rem; font-weight: 500;">
                <i class="material-icons left">business</i> New Customer Details
            </span>

            <div class="row" style="margin-top: 1rem;">
                <div class="input-field col s4">
                    <input value="ROSS-XXX" disabled style="color: #9e9e9e; font-weight: 700;">
                    <label class="active">Auto-Generated Code</label>
                </div>
                <div class="input-field col s8">
                    <input name="name" id="new_cust_name" type="text" required>
                    <label for="new_cust_name">Company Name</label>
                </div>
            </div>

            <div class="row">
                <div class="input-field col s6">
                    <input name="email" id="new_cust_email" type="email">
                    <label for="new_cust_email">Email Address</label>
                </div>
                <div class="input-field col s6">
                    <input name="phone" id="new_cust_phone" type="text">
                    <label for="new_cust_phone">Phone Number</label>
                </div>
            </div>

            <div class="row">
                <div class="input-field col s12">
                    <input name="address" id="new_cust_addr" type="text">
                    <label for="new_cust_addr">Primary Physical Address</label>
                </div>
            </div>

            <div class="row" style="margin-top: 0.5rem;">
                <div class="col s6">
                    <label style="font-size: 0.8rem; color: #9e9e9e; font-weight: 700; display: block; margin-bottom: 8px;">Customer Type</label>
                    <div style="display: flex; gap: 1rem;">
                        <label style="cursor: pointer;">
                            <input type="radio" name="customerType" value="CASH" checked
                                   onchange="toggleCreditLimit(this.value)"
                                   class="with-gap">
                            <span style="font-weight: 600;">CASH</span>
                        </label>
                        <label style="cursor: pointer;">
                            <input type="radio" name="customerType" value="CREDIT"
                                   onchange="toggleCreditLimit(this.value)"
                                   class="with-gap">
                            <span style="font-weight: 600;">CREDIT</span>
                        </label>
                    </div>
                </div>
                <div class="input-field col s6" id="creditLimitField" style="display: none;">
                    <i class="material-icons prefix">account_balance</i>
                    <input name="creditLimit" id="new_cust_limit" type="number" step="0.01" min="0">
                    <label for="new_cust_limit">Credit Limit (GHS)</label>
                </div>
            </div>
        </div>

        <div class="card-action right-align" style="background: rgba(0,0,0,0.02); border-top: 1px solid #eee;">
            <button type="button" class="btn-flat waves-effect grey-text"
                    onclick="document.getElementById('new-customer-row').remove()">
                Cancel
            </button>
            <button type="submit" class="btn blue darken-2 waves-effect waves-light">
                <i class="material-icons left">save</i> Save Customer
            </button>
        </div>
    </form>
</div>
<script>
M.updateTextFields();
function toggleCreditLimit(type) {
    var field = document.getElementById('creditLimitField');
    if (!field) return;
    field.style.display = type === 'CREDIT' ? '' : 'none';
    var input = document.getElementById('new_cust_limit');
    if (type !== 'CREDIT' && input) input.value = '';
}
</script>
