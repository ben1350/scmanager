<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosswood — Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <style>
        :root {
            --navy: #0a1628;
            --blue: #1a56db;
            --blue-light: #3b82f6;
            --slate: #64748b;
            --border: #e2e8f0;
            --bg: #f0f4ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        /* Left panel */
        .left-panel {
            background: var(--navy);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 4rem;
            position: relative;
            overflow: hidden;
        }

        .left-panel::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(26,86,219,0.3) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            border-radius: 50%;
        }

        .left-panel::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(59,130,246,0.2) 0%, transparent 70%);
            bottom: 50px;
            left: 50px;
            border-radius: 50%;
        }

        .left-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 3rem;
            position: relative;
            z-index: 1;
        }

        .left-logo-icon {
            width: 44px;
            height: 44px;
            background: var(--blue);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .left-logo-icon i { color: white; font-size: 1.4rem; }

        .left-logo span {
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .left-headline {
            position: relative;
            z-index: 1;
        }

        .left-headline h2 {
            font-family: 'DM Serif Display', serif;
            color: white;
            font-size: 2.8rem;
            line-height: 1.2;
            margin-bottom: 1rem;
            font-weight: 400;
        }

        .left-headline h2 span {
            color: var(--blue-light);
        }

        .left-headline p {
            color: rgba(255,255,255,0.5);
            font-size: 0.95rem;
            line-height: 1.6;
            max-width: 320px;
        }

        .left-badges {
            display: flex; gap: 10px; margin-top: 2.5rem; flex-wrap: wrap; position: relative; z-index: 1;
        }

        .badge {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50px;
            padding: 6px 14px;
            color: rgba(255,255,255,0.6);
            font-size: 0.78rem;
            font-weight: 500;
        }

        /* Right panel */
        .right-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
        }

        /* Logo styling for the login form */
        .login-form-logo {
            display: block;
            margin: 0 auto 1.5rem auto;
            max-height: 60px;
            width: auto;
        }

        .login-box h3 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 0.4rem;
            letter-spacing: -0.4px;
            text-align: center; /* Centered for better look with logo */
        }

        .login-box .subtitle {
            color: var(--slate);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .field-wrap { margin-bottom: 1.2rem; }

        .field-wrap label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--navy);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 7px;
        }

        .input-inner { position: relative; }

        .input-inner i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.1rem;
            pointer-events: none;
        }

        .input-inner input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.92rem;
            font-family: 'DM Sans', sans-serif;
            color: var(--navy);
            background: white;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            border-bottom: 1.5px solid var(--border) !important;
            box-shadow: none !important;
            height: auto !important;
            margin: 0 !important;
        }

        .input-inner input:focus {
            border-color: var(--blue) !important;
            box-shadow: 0 0 0 3px rgba(26,86,219,0.1) !important;
        }

        .btn-signin {
            display: block;
            width: 100%;
            padding: 13px;
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            margin-top: 1.6rem;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(26,86,219,0.3);
            letter-spacing: 0.01em;
        }

        .btn-signin:hover {
            background: #1447c0;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(26,86,219,0.4);
        }

        .divider-line {
            height: 1px;
            background: var(--border);
            margin: 1.5rem 0;
        }

        .footer-note {
            text-align: center;
            color: #94a3b8;
            font-size: 0.75rem;
            margin-top: 1.5rem;
        }

        @media (max-width: 768px) {
            body { grid-template-columns: 1fr; }
            .left-panel { display: none; }
            .right-panel { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

<div class="left-panel">
    <div class="left-logo">
        <img src="image_58f646.png" alt="Rosswood Logo" style="height: 44px; width: auto;">
        <span>Rosswood</span>
    </div>

    <div class="left-headline">
        <h2>Modern Management <span>Simplified.</span></h2>
        <p>A comprehensive system designed specifically for Rosswood's operational excellence.</p>
    </div>

    <div class="left-badges">
        <span class="badge">Inventory</span>
        <span class="badge">Production</span>
        <span class="badge">Sales</span>
        <span class="badge">Customers</span>
    </div>
</div>

<div class="right-panel">
    <div class="login-box">
        <img src="image_58f646.png" alt="Rosswood" class="login-form-logo">

        <h3>Welcome back</h3>
        <p class="subtitle">Sign in to your account to continue</p>

        <form action="/_renarde/security/login" method="POST">
            <div class="field-wrap">
                <label>Username</label>
                <div class="input-inner">
                    <i class="material-icons-round">person_outline</i>
                    <input type="text" name="username" placeholder="Enter your username" required autofocus autocomplete="username">
                </div>
            </div>

            <div class="field-wrap">
                <label>Password</label>
                <div class="input-inner">
                    <i class="material-icons-round">lock_outline</i>
                    <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-signin">Sign In</button>
        </form>

        <div class="divider-line"></div>
        <div class="footer-note">© DataChefs · Rosswood Management System</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
