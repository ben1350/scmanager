{@com.rosswood.entity.Item item}
<div style="padding: 2rem; background: #fafafa; border-top: 1px solid #eee;">
    <div class="row">
        <div class="col s6">
            <h6 style="font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: #9e9e9e;">Units</h6>
            {#for uom in itemUoms}
                <div style="background:white; padding: 10px; margin-bottom: 5px; border-radius: 8px; border: 1px solid #eee;">
                    {uom.uomCode} {#if uom.isBase}<span class="blue-text" style="font-size: 0.6rem;">(BASE)</span>{/if}
                </div>
            {/for}
        </div>
        <div class="col s6" style="border-left: 1px solid #eee;">
            <h6 style="font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: #9e9e9e;">Conversions</h6>
            {#for c in itemConversions}
                <div style="font-size: 0.9rem; padding: 5px 0; border-bottom: 1px dashed #ddd;">
                    1 {c.fromUom} = <b>{c.conversionFactor}</b> {c.toUom}
                </div>
            {/for}
        </div>
    </div>
</div>
