<div id="new-batch-row" class="card" style="border-radius: 16px; margin-bottom: 2rem; border: 2px dashed #2196f3 !important; background: #fafafa;">
    <form hx-post="{uri:ProductionBatchController.add()}" hx-target="#batchListContainer">
            {#authenticityToken/}
        <div class="card-content" style="padding: 2rem;">
            <span class="card-title blue-text text-darken-2" style="font-weight: 600;">Initialize Production</span>
            <div class="row" style="margin-top: 2rem;">
                <div class="input-field col s12 m3">
                    <input value="PB-XXXX" disabled style="color: #9e9e9e; font-weight: 700;">
                    <label class="active">Auto-Generated Code</label>
                </div>
                <div class="input-field col s12 m3">
                    <input name="productionDate" id="prod_date" type="text" class="datepicker" required>
                    <label for="prod_date">Date</label>
                </div>
                <div class="input-field col s12 m4">
                    <select name="finishedItemId" id="finishedItemSelect" style="border: 1px solid #ddd; height: 45px; border-radius: 8px;">
                        <option value="" disabled selected>Select Finished Product</option>
                        {#for item in items}
                            <option value="{item.id}" data-uom="{item.uom.uomCode ?: ''}">{item.itemName}</option>
                        {/for}
                    </select>
                </div>
                <div class="input-field col s12 m2">
                    <input name="outputQty" id="output_qty" type="number" step="0.01" required>
                    <label for="output_qty">Target Qty</label>
                    <span id="outputUomLabel" style="font-size:0.75rem; font-weight:700; color:#1565c0;
                          background:#e3f2fd; padding:2px 8px; border-radius:4px;
                          margin-top:4px; display:inline-block; visibility:hidden;">—</span>
                </div>
            </div>
        </div>
        <div class="card-action right-align">
            <button type="button" class="btn-flat" onclick="this.closest('#new-batch-row').remove()">Cancel</button>
            <button type="submit" class="btn-large blue darken-2" style="border-radius: 50px;">Start Batch</button>
        </div>
    </form>
</div>

<script>
    (function() {
        // Initialize the Datepicker
        var dateElems = document.querySelectorAll('.datepicker');
        M.Datepicker.init(dateElems, {
            format: 'yyyy-mm-dd',
            autoClose: true,
            container: 'body'
        });

        // Initialize the Select dropdown (fixes the "missing" select box)
        var selectElems = document.querySelectorAll('#new-batch-row select');
        M.FormSelect.init(selectElems);

        // Show base UOM next to Target Qty when a finished product is selected
        var finishedSel = document.getElementById('finishedItemSelect');
        var uomLabel    = document.getElementById('outputUomLabel');
        if (finishedSel && uomLabel) {
            finishedSel.addEventListener('change', function() {
                var opt = this.options[this.selectedIndex];
                var uom = opt ? opt.getAttribute('data-uom') : '';
                if (uom) {
                    uomLabel.textContent     = uom;
                    uomLabel.style.visibility = 'visible';
                } else {
                    uomLabel.style.visibility = 'hidden';
                }
            });
        }

        // Force label animation/alignment for all inputs (Output Qty, etc.)
        M.updateTextFields();
    })();
</script>
