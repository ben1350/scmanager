<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosswood</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e3f2fd;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Wrap Renarde's injected content in a Materialize card */
        body > form,
        body > div {
            background: white;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1a237e;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        /* Materialize-style input fields */
        label {
            color: #1565c0 !important;
            font-size: 0.85rem !important;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            border-bottom: 2px solid #90caf9 !important;
            box-shadow: none !important;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: #1a237e;
            width: 100%;
            padding: 8px 0;
            margin-bottom: 1rem;
            background: transparent;
            border: none;
            border-bottom: 2px solid #90caf9;
            outline: none;
            transition: border-color 0.2s;
            display: block;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-bottom: 2px solid #1565c0 !important;
        }

        input[type="submit"],
        button[type="submit"] {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 1.5rem;
            background-color: #1565c0;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            box-shadow: 0 4px 12px rgba(21,101,192,0.4);
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        input[type="submit"]:hover,
        button[type="submit"]:hover {
            background-color: #0d47a1;
            box-shadow: 0 6px 16px rgba(21,101,192,0.5);
        }

        .error, .alert, p.error {
            background: #ffebee;
            border-left: 4px solid #e53935;
            border-radius: 4px;
            padding: 10px 14px;
            color: #c62828;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

<div>
    <!-- Logo header -->
    <div style="text-align:center; margin-bottom: 1.5rem;">
        <div style="width:56px;height:56px;background:#1565c0;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(21,101,192,0.4);">
            <i class="material-icons white-text" style="font-size:1.8rem;">inventory_2</i>
        </div>
        <p style="color:#546e7a;font-size:0.85rem;margin-top:8px;margin-bottom:0;">Rosswood Management System</p>
    </div>

    {#insert /}
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
