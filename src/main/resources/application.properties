%dev.quarkus.datasource.db-kind=postgresql

quarkus.flyway.migrate-at-start=true
%dev.quarkus.flyway.clean-at-start=true
%prod.quarkus.flyway.clean-at-start=false
%dev.quarkus.datasource.dev-ui.allow-sql=true

quarkus.http.auth.proactive=false
# The mobile app (/api/mobile/*) is a stateless Bearer-token API with no cookie jar, so it
# can't carry a CSRF token. With require-form-url-encoded disabled (and verifyToken left at
# its default 'true'), the Renarde CSRF filter skips token checks for non-form POST bodies
# like JSON, letting the mobile API through. Web form sessions are still protected by the
# SameSite=Lax session cookie. Note: do NOT set verify-token=false — that re-enables the
# token-presence/size/content-type checks and breaks JSON logins (HTTP 400).
quarkus.rest-csrf.require-form-url-encoded=false

# Railway terminates TLS at its edge and forwards plain HTTP with X-Forwarded-* headers.
# Honor them so Quarkus sees the real https scheme/host — fixes the post-login redirect loop
# and ensures the Renarde session cookie is issued/read correctly behind the proxy.
%prod.quarkus.http.proxy.proxy-address-forwarding=true
%prod.quarkus.http.proxy.enable-forwarded-host=true
%prod.quarkus.http.proxy.enable-forwarded-prefix=true

%dev.quarkus.http.proxy.proxy-address-forwarding=true
%dev.quarkus.http.proxy.enable-forwarded-host=true

# Railway injects PORT — fall back to 8080 in dev
%dev.quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}


# DB config — reads from env vars in production, falls back to local dev defaults
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/scmanager}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:scmanager}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:scmanager}

# Stable session encryption key — prevents logouts on redeploy
quarkus.http.auth.session.encryption-key=${SESSION_ENCRYPTION_KEY:dev-only-insecure-key-change-in-prod}

# JWT signing/encryption keys for Renarde session management (prod only — dev auto-generates)
%prod.smallrye.jwt.sign.key.location=privateKey.pem
%prod.smallrye.jwt.encrypt.key.location=publicKey.pem
%prod.mp.jwt.verify.publickey.location=publicKey.pem
# The session cookie is signed-then-encrypted (JWE). Incoming requests must DECRYPT it
# with the private key before the signature can be verified — without this, the cookie
# can never be read back and every request bounces to login (the redirect loop).
%prod.mp.jwt.decrypt.key.location=privateKey.pem
%prod.mp.jwt.verify.issuer=https://rosswood.up.railway.app

# After logout (and unauthenticated access), redirect to the custom login page
quarkus.renarde.security.login-page=/Login/login

